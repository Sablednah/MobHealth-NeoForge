# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.3
# What we BUILD against is one exact version; what the jar REFUSES to load on is a
# different question. Both ranges below are deliberately wider than the build, so a
# NeoForge or Minecraft bugfix drop doesn't strand the mod on a version nobody runs.
minecraft_version_range=[26.3,26.4)
# The Neo version must agree with the Minecraft version to get a valid artifact.
neo_version=26.3.0.58-beta
# ...and the DEPENDENCY floor is that same build, for once, because the line is split: see below.
#
# ⚠ Floored at 26.3.0.58-beta. .37 shipped FML 12.0.8, which renamed ModConfig.Type COMMON ->
# LOCAL (and SERVER -> SYNCED): this jar registers LOCAL, so on .33-.36 it would die with
# NoSuchFieldError. The floor is the build this was ported and tested on rather than .37, since
# nothing between has been run. The bound must carry -beta: in Maven ordering 26.3.0.58-beta sorts
# BEFORE 26.3.0.58, so [26.3.0.58,) would refuse the very build it was made for.
neo_version_range=[26.3.0.58-beta,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=mobhealth
mod_name=MobHealth
mod_license=MIT
mod_version=2.5.3
mod_group_id=com.sablednah.mobhealth
mod_authors=Sablednah
mod_description=Displays mob damage and remaining health with configurable graphical bars, nameplate bars, boss bars, and chat messages. A modern NeoForge rewrite of the classic MobHealth Bukkit plugin.
